<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat · Homelab</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');

    :root {
      --bg:       #0a0a0f;
      --surface:  #111118;
      --surface2: #1a1a24;
      --border:   #ffffff0f;
      --accent:   #4fc3f7;
      --accent2:  #7dd8f8;
      --text:     #f0f0f0;
      --muted:    #888899;
      --user-bubble: #1565c0;
      --ai-bubble:   #1a1a24;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* TOPBAR */
    .topbar {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 28px;
      height: 62px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .back-btn {
      color: var(--muted);
      text-decoration: none;
      font-size: 1.2rem;
      transition: color .2s;
      flex-shrink: 0;
    }
    .back-btn:hover { color: var(--text); }

    .topbar-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 3px;
      color: var(--accent);
      text-decoration: none;
      flex: 1;
    }
    .topbar-logo span { color: var(--text); }

    .model-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 7px 14px;
      font-size: 0.82rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      transition: border-color .2s;
    }
    .model-select:focus { border-color: var(--accent); }

    /* STATUS */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 28px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
      transition: background .3s;
    }
    .status-dot.online  { background: #4caf50; box-shadow: 0 0 6px #4caf5066; }
    .status-dot.offline { background: #e55; }
    .status-dot.loading { background: #f5a623; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }

    /* MESSAGES */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 0;
    }

    .msg { display: flex; gap: 12px; max-width: 820px; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.ai   { align-self: flex-start; }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.65;
      max-width: 600px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.ai .bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .bubble.typing { color: var(--muted); font-style: italic; }

    /* OLLAMA NOTICE */
    .ollama-notice {
      background: #1a1200;
      border: 1px solid #f5a62366;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 0.85rem;
      color: #f5c842;
      line-height: 1.6;
    }

    /* INPUT */
    .input-area {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 16px 28px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    textarea {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      padding: 12px 16px;
      font-size: 0.92rem;
      resize: none;
      font-family: inherit;
      outline: none;
      line-height: 1.5;
      max-height: 140px;
      transition: border-color .2s;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }

    .send-btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: background .2s, transform .1s;
      flex-shrink: 0;
    }
    .send-btn:hover   { background: var(--accent2); }
    .send-btn:active  { transform: scale(.95); }
    .send-btn:disabled { background: var(--surface2); color: var(--muted); cursor: not-allowed; }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }

    @media (max-width: 600px) {
      .topbar     { padding: 0 14px; gap: 12px; }
      .status-bar { padding: 8px 14px; }
      #messages   { padding: 16px 14px; }
      .input-area { padding: 10px 14px; }
      /* Prevent iOS auto-zoom on focus */
      textarea    { font-size: 1rem; }
      /* Compact model select */
      .model-select { max-width: 140px; padding: 6px 8px; font-size: 0.78rem; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <a href="/index.html" class="back-btn">←</a>
  <span class="topbar-logo">HOME<span>AI</span></span>
  <select class="model-select" id="modelSelect" disabled>
    <option value="">Loading models...</option>
  </select>
</header>

<div class="status-bar">
  <div class="status-dot loading" id="statusDot"></div>
  <span id="statusText">Connecting to Ollama...</span>
</div>

<div id="messages"></div>

<div class="input-area">
  <textarea id="input" rows="1" placeholder="Type a message..." disabled></textarea>
  <button class="send-btn" id="sendBtn" disabled>➤</button>
</div>

<script>
// Replace with your Raspberry Pi's IP address
const OLLAMA_URL = 'http://192.168.1.100:11434';

const messagesEl  = document.getElementById('messages');
const input       = document.getElementById('input');
const sendBtn     = document.getElementById('sendBtn');
const modelSelect = document.getElementById('modelSelect');
const statusDot   = document.getElementById('statusDot');
const statusText  = document.getElementById('statusText');

const history = [];
let ollamaReady = false;

// ── Check Ollama connection ───────────────────────────────────────────────────
async function checkOllama() {
  try {
    const res  = await fetch(OLLAMA_URL + '/api/tags');
    if (res.ok) {
      const data   = await res.json();
      const models = data.models || [];
      if (models.length) {
        modelSelect.innerHTML = '';
        models.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.name;
          opt.textContent = m.name;
          modelSelect.appendChild(opt);
        });
        modelSelect.disabled = false;
      }
      if (!models.length) {
        modelSelect.innerHTML = '<option value="">No models installed</option>';
        setStatus('offline', 'Ollama connected but no models installed — run: ollama pull gemma3:1b');
        setTimeout(checkOllama, 5000);
        return;
      }
      setStatus('online', `Ollama connected · ${models.length} model${models.length === 1 ? '' : 's'} available`);
      ollamaReady = true;
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    } else {
      setStatus('offline', 'Ollama not responding — retrying...');
      setTimeout(checkOllama, 5000);
    }
  } catch {
    setStatus('offline', 'Ollama unreachable — retrying in 5s');
    if (!ollamaReady) {
      showNotice();
      setTimeout(checkOllama, 5000);
    }
  }
}

function setStatus(state, text) {
  statusDot.className = 'status-dot ' + state;
  statusText.textContent = text;
}

function showNotice() {
  if (document.querySelector('.ollama-notice')) return;
  const div = document.createElement('div');
  div.className = 'ollama-notice';
  div.innerHTML = `⚠ <b>Ollama is not running.</b> Follow the Ollama setup section in the README to install and configure it. This page will automatically retry every 5 seconds.`;
  messagesEl.appendChild(div);
}

// ── Messages ──────────────────────────────────────────────────────────────────
function addMsg(role, text, isTyping = false) {
  const div    = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '👤' : '🤖';
  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (isTyping ? ' typing' : '');
  bubble.textContent = text;
  div.appendChild(avatar);
  div.appendChild(bubble);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

// ── Send ──────────────────────────────────────────────────────────────────────
async function send() {
  const text = input.value.trim();
  if (!text || !ollamaReady) return;

  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  input.disabled   = true;

  history.push({ role: 'user', content: text });
  addMsg('user', text);
  const bubble = addMsg('ai', '...', true);

  try {
    const res = await fetch(OLLAMA_URL + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: modelSelect.value, messages: history, stream: false }),
      signal: AbortSignal.timeout(600000)
    });
    const data  = await res.json();
    const reply = data.message?.content || 'No response received.';
    history.push({ role: 'assistant', content: reply });
    bubble.textContent = reply;
    bubble.classList.remove('typing');
  } catch {
    bubble.textContent = 'Error: could not reach Ollama.';
    bubble.classList.remove('typing');
  }

  sendBtn.disabled = false;
  input.disabled   = false;
  input.focus();
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// ── Auto-resize textarea ──────────────────────────────────────────────────────
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

// ── Scroll to messages when keyboard appears (mobile) ─────────────────────────
input.addEventListener('focus', () => {
  setTimeout(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }, 300);
});

// ── Init ──────────────────────────────────────────────────────────────────────
checkOllama();
</script>
</body>
</html>
